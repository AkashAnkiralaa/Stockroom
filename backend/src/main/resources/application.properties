spring.application.name=inventory-api
server.port=${PORT:${SERVER_PORT:8082}}
spring.datasource.url=jdbc:h2:file:${DB_FILE:./data/inventorydb};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5176}
server.error.include-message=always
