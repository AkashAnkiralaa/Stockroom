services:
  - type: web
    name: stockroom-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/products
    envVars:
      - key: DB_FILE
        value: /tmp/inventorydb
      - key: DB_PASSWORD
        generateValue: true
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
